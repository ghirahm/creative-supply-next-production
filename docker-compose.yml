services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`creativesupply.id`) || Host(`www.creativesupply.id`)"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.tls=true"
      - "traefik.http.routers.website.middlewares=www-redirect,rate-limit@file,security-headers@file"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.creativesupply\\.id/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://creativesupply.id/$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.website.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
